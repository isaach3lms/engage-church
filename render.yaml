services:
  - type: web
    name: engage-church
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: website@engagebloomfield.com
      - key: CONTACT_TO
        value: info@engagebloomfield.com
      - key: YOUTUBE_CHANNEL_ID
        sync: false
      - key: YOUTUBE_CHANNEL_URL
        value: https://www.youtube.com/@engagebloomfield
      - key: GIVE_URL
        sync: false
      - key: PRECHECK_URL
        sync: false
